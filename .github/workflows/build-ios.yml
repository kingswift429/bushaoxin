name: Build iOS

# 为什么有这个文件：
#   开发机是 Windows，装不了 Xcode。
#   GitHub Actions 提供 macOS runner，在云端真正跑 xcodebuild ——
#   等于不用买 Mac 也能编译、甚至上架 TestFlight。
#
# 前提：**本文件所在的 bushaoxin 目录就是仓库根**。
#   也就是 project.yml / Bushaoxin/ / docs/ 都在仓库第一层。
#   如果你改了目录层级，下面的所有路径都要跟着改。
#
# 用法：
#   1. 在本目录 git init && git add . && git commit && git push
#   2. 打开仓库 Actions 页，选 "Build iOS"，点 Run workflow
#   3. 编译错误会显示在日志的「编译错误汇总」里
#
# 私有仓库注意：macOS runner 按 10 倍消耗配额，
# 免费额度 2000 分钟/月 ≈ 200 分钟 macOS，约够编译 20 次。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS)
    # macos-26：Apple 从 2026 年起要求用 iOS 26 SDK（Xcode 26）编译才能上架。
    # macos-15 只有 Xcode 16.4（iOS 18.5 SDK），上传会被 409 拒收。
    # 这里同步升级，保证 CI 编译环境和发布环境一致。
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i simulator

      # XcodeGen 的版本会影响生成的 pbxproj 格式，固定版本便于复现问题。
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          # 关键：确认 .xcodeproj 真的生成了，否则后面的 xcodebuild 会报
          # "does not exist"，而不是给出编译错误。
          test -f Bushaoxin.xcodeproj/project.pbxproj || {
            echo "::error::xcodegen 没有生成 Bushaoxin.xcodeproj/project.pbxproj"
            exit 1
          }
          echo "--- 源文件是否都被收进工程 ---"
          grep -c "\.swift" Bushaoxin.xcodeproj/project.pbxproj || true

      - name: Show scheme
        run: |
          xcodebuild -list -project Bushaoxin.xcodeproj
          # 关键：scheme 不存在时，xcodebuild 会返回 0 但什么都不编译！
          # 这里提前硬性校验，避免「假装编译成功」。
          xcodebuild -list -project Bushaoxin.xcodeproj -json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d["project"]; print("schemes:",p["schemes"]); sys.exit(0 if "Bushaoxin" in p["schemes"] else 1)' \
            || { echo "::error::没有名为 Bushaoxin 的 scheme，检查 project.yml 的 target 名"; exit 1; }

      - name: Build
        shell: bash
        run: |
          # GitHub 用 `bash -e` 执行本步骤，xcodebuild 一旦失败就会立刻退出，
          # 下面的错误汇总永远执行不到。所以这里先关掉 -e，自己判断退出码。
          set +e
          set -o pipefail

          xcodebuild build \
            -project Bushaoxin.xcodeproj \
            -scheme Bushaoxin \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1
          BUILD_STATUS=$?

          echo "=========================================="
          echo "编译错误汇总（最多 100 行）："
          echo "=========================================="
          # 用 `if grep -q ...; then 打印; else 提示; fi`，不要用 `grep ... || echo`：
          # 在 pipefail 下，sort/head 任何一段异常都会让 || 分支误报「无 error」，
          # 真的编译失败时反而告诉你看不到错误。先 -q 判断有没有匹配，再打印。
          if grep -qE "error:" build.log; then
            grep -E "error:" build.log | sort -u | head -100
          else
            echo "（日志中无 error: 行）"
          fi

          echo ""
          echo "=========================================="
          echo "编译警告汇总（最多 40 行）："
          echo "=========================================="
          if grep -qE "warning:" build.log; then
            grep -E "warning:" build.log | sort -u | head -40
          else
            echo "（日志中无 warning: 行）"
          fi

          echo ""
          echo "日志尾部 60 行："
          tail -60 build.log

          # 先判编译退出码，再做产物校验。
          # 顺序不能反：编译失败时本来就不会有 .app，
          # 若先查产物，会以"没有 .app"退出，把真实的 xcodebuild 错误码盖掉。
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::编译失败（xcodebuild exit $BUILD_STATUS），见上方错误汇总"
            exit "$BUILD_STATUS"
          fi

          # 产物校验：退出码为 0 不代表真的编出了东西（scheme 为空时会空跑）。
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::xcodebuild 返回 0 但没有找到 .app 产物 —— 编译并未真正执行"
            exit 1
          fi

          echo "::notice::产物：$APP"
          ls -la "$APP" | head -20
          test -f "$APP/Info.plist" && echo "Info.plist 存在" \
            || echo "::warning::产物里没有 Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "PrivacyInfo.xcprivacy 已打包" \
            || echo "::warning::PrivacyInfo.xcprivacy 没有被打包进 App"
          test -f "$APP/Assets.car" && echo "Assets.car 已打包" \
            || echo "::warning::没有 Assets.car（AppIcon/AccentColor 可能没生效）"

          # ── 图标必须真的进包，否则安装后显示系统占位图 ──────────
          #
          # 出过的问题：TestFlight 装到 iPhone 上图标是空白的。
          # 原因是 AppIcon.appiconset 里只有 default 变体，
          # iOS 26/Xcode 26 的 actool 没有生成图标条目。
          #
          # 这里硬性检查三件事，任何一条不满足直接失败，
          # 不要等到装到手机上才发现。
          echo ""
          echo "=== App 图标校验 ==="

          ICON_FAIL=0
          shopt -s nullglob
          ICONS=("$APP"/AppIcon*.*)
          shopt -u nullglob

          if [ ${#ICONS[@]} -eq 0 ]; then
            echo "::error::产物里没有任何 AppIcon* 文件 —— actool 没有生成图标"
            ICON_FAIL=1
          else
            echo "找到 ${#ICONS[@]} 个图标文件："
            for f in "${ICONS[@]}"; do
              echo "  $(basename "$f")  $(du -h "$f" | cut -f1)"
            done
          fi

          # Info.plist 里必须引用图标
          if [ -f "$APP/Info.plist" ]; then
            if /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" >/dev/null 2>&1; then
              ICON_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist")
              echo "Info.plist 图标键：CFBundleIconName = $ICON_NAME"
            else
              # 旧式 CFBundleIconFiles 也可以
              if /usr/libexec/PlistBuddy -c "Print :CFBundleIconFiles" "$APP/Info.plist" >/dev/null 2>&1; then
                echo "Info.plist 使用 CFBundleIconFiles（旧式）"
              else
                echo "::error::Info.plist 里既没有 CFBundleIconName 也没有 CFBundleIconFiles"
                ICON_FAIL=1
              fi
            fi
          fi

          # Assets.car 里必须能找到 AppIcon 符号
          if [ -f "$APP/Assets.car" ]; then
            if xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" 2>/dev/null | grep -q "AppIcon"; then
              echo "Assets.car 内含 AppIcon 条目"
            else
              echo "::error::Assets.car 里找不到 AppIcon 条目 —— 图标没有被编译进去"
              ICON_FAIL=1
            fi
          fi

          if [ "$ICON_FAIL" -ne 0 ]; then
            echo "::error::图标校验未通过，安装后会显示系统占位图"
            exit 1
          fi
          echo "图标校验通过"

          # ── 本地化校验 ─────────────────────────────────────────
          #
          # 出过的问题：merge_translations.py 把 Localizable.xcstrings.bak
          # 备份留在原目录，actool 把它当成资源一起打进了 .app。
          # 后果是包体白白增大，且审核看到 .bak 会追问。
          #
          # 这里既检查"该有的 lproj 在不在"，也检查"不该有的文件在不在"。
          echo ""
          echo "=== 本地化校验 ==="

          L10N_FAIL=0

          # 支持的 12 种语言，必须和 project.yml 的 CFBundleLocalizations 一致
          EXPECTED_LOCALES="zh-Hans en ja ko fr de es pt-BR ru ar it nl"
          MISSING=""
          for loc in $EXPECTED_LOCALES; do
            if [ ! -d "$APP/$loc.lproj" ]; then
              MISSING="$MISSING $loc"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::缺少本地化目录：$MISSING"
            L10N_FAIL=1
          else
            echo "12 种语言的 .lproj 全部存在"
          fi

          # 每种语言都要有可用的 Localizable.strings
          for loc in $EXPECTED_LOCALES; do
            f="$APP/$loc.lproj/Localizable.strings"
            if [ -f "$f" ]; then
              # plutil 能解析才说明是合法 plist/strings
              if ! plutil -lint "$f" >/dev/null 2>&1; then
                echo "::error::$loc 的 Localizable.strings 格式非法"
                L10N_FAIL=1
              fi
            else
              echo "::error::$loc.lproj 里没有 Localizable.strings"
              L10N_FAIL=1
            fi
          done
          echo "各语言 Localizable.strings 格式合法"

          # 备份文件绝不能进包
          STRAY=$(find "$APP" -name "*.bak" -o -name "*.orig" -o -name "*~" 2>/dev/null)
          if [ -n "$STRAY" ]; then
            echo "::error::产物里混入了备份/临时文件："
            echo "$STRAY"
            L10N_FAIL=1
          else
            echo "没有多余的备份文件"
          fi

          # ── 图标显示名必须按语言生效 ────────────────────────────
          #
          # 这是最容易"看起来成功但实际没生效"的一环：
          # InfoPlist.strings 只有在 <locale>.lproj/ 目录里，
          # 才会被 Xcode 当作「覆盖 Info.plist」的本地化资源。
          # 如果文件名是平铺的 InfoPlist.zh-Hans.strings，
          # 编译不会报错，但 CFBundleDisplayName 永远不会被覆盖，
          # 图标名在任何语言下都还是中文。
          #
          # 所以这里直接读产物里的文件内容来验证。
          echo ""
          echo "=== 图标显示名本地化校验 ==="

          NAME_FAIL=0
          for loc in $EXPECTED_LOCALES; do
            f="$APP/$loc.lproj/InfoPlist.strings"
            if [ ! -f "$f" ]; then
              echo "::error::$loc.lproj 里没有 InfoPlist.strings —— 图标名不会本地化"
              NAME_FAIL=1
              continue
            fi
            # 从二进制 plist 里取 CFBundleDisplayName
            nm=$(plutil -extract CFBundleDisplayName raw -o - "$f" 2>/dev/null || echo "")
            if [ -z "$nm" ]; then
              echo "::error::$loc 的 InfoPlist.strings 里没有 CFBundleDisplayName"
              NAME_FAIL=1
            else
              echo "  $loc -> $nm"
            fi
          done

          # 中文必须是「不烧心」，其余必须是 Wait A Day。
          # 防止哪天有人批量替换把中文名也一起改掉。
          ZH_NAME=$(plutil -extract CFBundleDisplayName raw -o - "$APP/zh-Hans.lproj/InfoPlist.strings" 2>/dev/null || echo "")
          EN_NAME=$(plutil -extract CFBundleDisplayName raw -o - "$APP/en.lproj/InfoPlist.strings" 2>/dev/null || echo "")
          if [ "$ZH_NAME" != "不烧心" ]; then
            echo "::error::中文图标名应为「不烧心」，实际是「$ZH_NAME」"
            NAME_FAIL=1
          fi
          if [ "$EN_NAME" != "Wait A Day" ]; then
            echo "::error::英文图标名应为 Wait A Day，实际是「$EN_NAME」"
            NAME_FAIL=1
          fi

          if [ "$NAME_FAIL" -ne 0 ]; then
            echo "::error::图标显示名本地化校验未通过"
            exit 1
          fi
          echo "图标显示名本地化校验通过"

          if [ "$L10N_FAIL" -ne 0 ]; then
            echo "::error::本地化校验未通过"
            exit 1
          fi
          echo "本地化校验通过"

          echo "::notice::编译成功"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            Bushaoxin/Info.plist
          # Info.plist 由 xcodegen 生成，编译前几步失败时不存在，属正常
          if-no-files-found: ignore
          retention-days: 7
