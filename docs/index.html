<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不烧心 · Cool Head</title>
<style>
  :root {
    --ink: #2B2A28; --sub: #7A7570; --bg: #FBF8F4;
    --card: #FFFFFF; --line: #EAE4DC; --accent: #D9664A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.75; font-size: 16px;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 560px; padding: 48px 24px; width: 100%; }
  .logo {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: 34px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .tagline { color: var(--sub); font-size: 17px; margin: 0 0 44px; }
  .cards { display: grid; gap: 12px; }
  a.card {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 22px;
    text-decoration: none; color: var(--ink);
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateX(2px); }
  a.card .label { font-weight: 600; }
  a.card .sub { display: block; color: var(--sub); font-size: 13.5px; font-weight: 400; }
  a.card .arrow { color: var(--sub); font-size: 20px; }
  footer {
    margin-top: 40px; padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--sub); font-size: 13px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <span class="dot"></span>
    <h1>不烧心</h1>
  </div>
  <p class="tagline">花得值，不烧心 · Cool Head — Spend well, sleep fine.</p>

  <div class="cards">
    <a class="card" href="./privacy.html">
      <span>
        <span class="label">隐私政策</span>
        <span class="sub">Privacy Policy · プライバシーポリシー · 개인정보 처리방침</span>
      </span>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="./terms.html">
      <span>
        <span class="label">服务条款</span>
        <span class="sub">Terms of Service · 利用規約 · 서비스 이용약관</span>
      </span>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="https://github.com/kingswift429/bushaoxin">
      <span>
        <span class="label">开源仓库</span>
        <span class="sub">Source code on GitHub</span>
      </span>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>
    联系邮箱 <a href="mailto:support@bushaoxin.app">support@bushaoxin.app</a><br>
    © 2026 不烧心 / Cool Head
  </footer>

</div>
</body>
</html>
